# Conformité du coffre sur les trois plateformes.
#
# Raison d'être : la Slice 2 livrait DPAPI et libsecret « écrits d'après leur
# documentation, jamais constatés » (dette n° 3). Faute de machine Windows ou
# Linux sous la main, le seul moyen honnête de les constater est de les faire
# tourner sur des machines qui en sont — et des runners GitHub en sont.
#
# Ce workflow ne lance que `tests/unit/secrets.test.ts`, qui ne parle qu'à
# l'interface `SecretVault` et ignore quel coffre il éprouve. C'est la machine
# qui décide, et `MIDGAARD_REQUIRE_VAULT` qui vérifie qu'elle a décidé ce que ce
# poste prétend prouver : sans lui, un poste sans trousseau sauterait la
# batterie et passerait au vert sans rien avoir éprouvé.
#
# Quatre postes, dont un qui prouve une **absence** : le serveur Linux sans
# session graphique doit se rabattre sur le fichier, et ce repli est un
# comportement attendu, pas une panne.
name: Coffre

on:
  push:
    branches: [main]
    # Inutile de mobiliser quatre machines pour une retouche de documentation.
    paths:
      - 'packages/secrets/**'
      - 'packages/cli/src/commands.ts'
      - 'tests/unit/secrets.test.ts'
      - '.github/workflows/vault.yml'
      - 'package-lock.json'
  pull_request:
  workflow_dispatch: # pour pouvoir le relancer à la main après une mise à jour d'image

jobs:
  macos:
    name: trousseau macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run test:vault
        env:
          MIDGAARD_REQUIRE_VAULT: macos-keychain

  windows:
    name: DPAPI Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # DIAGNOSTIC TEMPORAIRE (3e tour) — à retirer dès que la suite est verte.
      #
      # Le relevé précédent a nommé la cause, en ne faisant varier que
      # l'environnement, script identique :
      #
      #   1 liste blanche actuelle   15029 ms  tué
      #   2 + PSModulePath seul      14832 ms  « True »
      #   3 + variables système      11266 ms  « True »
      #   4 environnement complet      177 ms  « True »
      #
      # Sans `PSModulePath`, PowerShell ne répond plus dès la première applet.
      # Avec celle de la machine, il répond mais parcourt des centaines de
      # modules — au-delà de notre délai de 10 s. D'où la correction : imposer
      # la variable, réduite aux modules du système.
      #
      # Celui-ci mesure donc ce que le produit construit vraiment, en important
      # `minimalEnv` plutôt qu'en le recopiant.
      - name: Vérifier l'environnement que le produit construit
        shell: bash
        continue-on-error: true
        run: |
          cat > diag.mjs <<'JS'
          import { execFile } from 'node:child_process'
          import { minimalEnv } from '@midgaard/secrets'
          const produit = minimalEnv()
          const sansPsModulePath = { ...produit }
          delete sansPsModulePath.PSModulePath
          console.log('PSModulePath imposée :', JSON.stringify(produit.PSModulePath ?? null))
          const script = "$ErrorActionPreference = 'Stop'\n[Console]::Out.Write([string](Test-Path -LiteralPath $env:SystemRoot))"
          for (const [nom, env] of Object.entries({
            'ce que fait le produit': produit,
            'la même, sans PSModulePath': sansPsModulePath,
            'environnement complet': process.env,
          })) {
            const t0 = Date.now()
            await new Promise((res) => {
              execFile('powershell.exe',
                ['-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-EncodedCommand', Buffer.from(script,'utf16le').toString('base64')],
                { timeout: 15000, env, windowsHide: true },
                (e, out) => { console.log(`${nom.padEnd(28)} ${String(Date.now()-t0).padStart(6)} ms  tué=${Boolean(e?.killed)}  stdout=${JSON.stringify(String(out).slice(0,40))}`); res() },
              ).stdin?.end('')
            })
          }
          JS
          node --conditions=midgaard-dev diag.mjs
      - run: npm run test:vault
        env:
          MIDGAARD_REQUIRE_VAULT: windows-dpapi

  linux-trousseau:
    name: libsecret (session de bureau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # `secret-tool` ne range rien tout seul : il parle au service Secret
      # Service par le bus de session. Il faut donc les trois — le binaire, un
      # bus, et un trousseau déverrouillé — ce qu'un runner n'a pas d'office.
      - name: Installer libsecret et gnome-keyring
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring
      # `dbus-run-session` fournit le bus ; `gnome-keyring-daemon --unlock` crée
      # et déverrouille le trousseau « login » à partir du mot de passe lu sur
      # l'entrée standard.
      #
      # Le mot de passe n'est pas vide, et ce n'est pas un détail : avec une
      # chaîne vide, le premier essai a obtenu un service qui répond mais
      # **sans collection par défaut** — « Object does not exist at path
      # /org/freedesktop/secrets/collection/login ». Ce secret ne protège rien
      # et ne sort pas du runner ; il n'existe que pour que la collection existe.
      #
      # Le dépôt d'essai, lui, se fait AVANT la suite et à dessein : le trousseau
      # peut répondre à un `lookup` sans pouvoir ranger quoi que ce soit, et
      # notre sonde de disponibilité ne voit pas la différence — elle prouve que
      # le service répond, pas qu'il a une collection. Sans ce dépôt, un poste
      # rouge accuserait le code alors que la cause serait la recette de CI.
      #
      # Rien dans le bloc `bash -c '…'` ne porte d'apostrophe : une seule y
      # fermerait la chaîne, et le reste du script partirait en morceaux.
      - name: Conformité sous un bus de session
        run: |
          set -e
          mkdir -p "$HOME/.local/share/keyrings"
          dbus-run-session -- bash -c '
            set -e
            echo -n "midgaard-ci" | gnome-keyring-daemon --unlock --components=secrets
            echo -n probe | secret-tool store --label=probe service midgaard-ci-probe account probe
            secret-tool clear service midgaard-ci-probe account probe
            npm run test:vault
          '
        env:
          MIDGAARD_REQUIRE_VAULT: libsecret

  linux-sans-trousseau:
    name: Linux sans trousseau (le repli est la bonne réponse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # Rien n'est installé ici, exprès. Ce poste vérifie le cas du serveur sans
      # session graphique : `openVault` doit retenir le repli fichier, et le
      # dire. C'est aussi lui qui aurait pris la sonde libsecret trop
      # indulgente — elle acceptait un `secret-tool` incapable de joindre le bus.
      - run: npm run test:vault
        env:
          MIDGAARD_REQUIRE_VAULT: file
