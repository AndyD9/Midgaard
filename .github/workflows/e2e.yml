# Le daemon de bout en bout, le dashboard et la CLI, sur les trois plateformes.
#
# Raison d'être (Slice 4, étape 5) : jusqu'ici, seules les suites unitaires de
# `workspace`, de l'écriture, d'`exec` et du coffre tournaient sous Windows et
# Linux. Le daemon réel — verrou d'instance unique, redémarrage, reprise
# WebSocket, Developer, sécurité, attente MCP —, le dashboard dans un vrai
# navigateur et la CLI n'avaient tourné que sous macOS. Ce sont pourtant eux
# qu'un tiers installera, et eux qui envoient des signaux, tuent des groupes de
# processus et posent des verrous : exactement ce qui diffère d'un système à
# l'autre. Le coffre a montré ce que vaut la relecture seule — cinq pannes
# réelles, invisibles depuis macOS.
#
# Chaque suite est une étape à part, et toutes s'exécutent même si une
# précédente échoue : une panne de `test:lock` sous Windows ne doit pas cacher
# ce que `test:security` aurait dit. Une suite qui saute un cas le dit dans sa
# sortie (`CONSTAT`, « SANS … ») ; aucune ne passe au vert sans avoir tourné.
name: Bout en bout

on:
  push:
    branches: [main]
    # La documentation ne mobilise pas trois machines pendant un quart d'heure.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
  # Appelé tel quel par la publication (publish.yml), sur le commit taggé :
  # un tag peut viser un commit de documentation, que `paths-ignore` a laissé
  # sans passage (Slice 4, étape 7).
  workflow_call:

jobs:
  e2e:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: git --version
      # Le dashboard compilé est ce que le daemon sert : sans lui, S8 et
      # `test:ui` n'éprouveraient qu'une page « non compilé ».
      - id: build
        run: npm run build
      - name: Navigateur de Playwright
        run: npx playwright install --with-deps chromium

      - name: test:unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:unit
      - name: test:lock
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:lock
      - name: test:restart
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:restart
      - name: test:developer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:developer
      - name: test:security
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:security
      - name: test:wait
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:wait
      - name: test:ui
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:ui
      # Le paquet npm tel qu'un tiers l'installe : assemblé, installé dans un
      # préfixe vierge avec un HOME vierge, puis init, doctor, un vrai client MCP,
      # et la cohabitation avec un daemon des sources (Slice 4, étape 6).
      - name: test:package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:package
      # La CLI telle qu'un tiers la lance : déclaration MCP, diagnostic d'une
      # installation neuve — qui vérifie au passage la déclaration que `init`
      # vient d'écrire —, puis état. Le dossier runtime est jetable, et le coffre
      # est le fichier pour ne rien déposer dans le trousseau du poste.
      - name: CLI (init, doctor, status)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          MIDGAARD_HOME: ${{ runner.temp }}/midgaard-cli
          MIDGAARD_VAULT: file
        run: |
          npm run init
          npm run doctor
          npm run harness -- status
